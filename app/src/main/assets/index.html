<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>学生、学生家长车辆临时入校停车放申请</title>
<style>
:root{--red:#922d32;--line:#dedede;--label:#292929;--value:#707070;--asterisk:#c94b3e;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
body{font-size:16px}
.topbar{height:56px;background:var(--red);color:#fff;display:flex;align-items:center;padding:0 14px;gap:8px;position:sticky;top:0;z-index:10}
.back{font-size:33px;font-weight:200;line-height:1;width:28px;flex:none;margin-top:-3px}
.top-title{font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;flex:1}
.top-actions{height:34px;min-width:84px;border-radius:22px;background:#792328;display:flex;align-items:center;justify-content:space-evenly;font-size:21px;flex:none}
.top-actions span:last-child{border:2px solid #fff;border-radius:50%;width:19px;height:19px;display:inline-block;position:relative}
.top-actions span:last-child:after{content:"";position:absolute;inset:4px;border:1px solid #fff;border-radius:50%}
h1{font-size:35px;line-height:1.42;font-weight:400;margin:23px 14px 14px;letter-spacing:.2px}
.rule{height:9px;background:#ededed}
form{margin:0;padding:0}
.row{min-height:76px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,45%) minmax(0,55%);align-items:stretch;padding:0 24px 0 32px;gap:5px;background:#fff}
.label{font-size:21px;line-height:1.48;align-self:center;position:relative;padding:17px 0}
.label.required:before{content:"*";position:absolute;left:-21px;top:50%;transform:translateY(-50%);color:var(--asterisk);font-size:19px;font-weight:600}
.value{align-self:stretch;min-width:0;display:flex;align-items:center;justify-content:flex-end}
input,select,textarea{font-family:inherit;font-size:21px;color:var(--value);width:100%;min-width:0;border:0;outline:0;background:transparent;text-align:right;padding:12px 0;border-radius:0}
input::placeholder,textarea::placeholder{color:#aaa;opacity:1}
select{appearance:none;text-align-last:right;padding-right:0}
.select-wrap{width:100%;position:relative}
.select-wrap:after{content:"";position:absolute;right:0;top:50%;width:8px;height:8px;border-top:2px solid #999;border-right:2px solid #999;transform:translateY(-65%) rotate(45deg);pointer-events:none}
.select-wrap select{padding-right:19px}
textarea{text-align:left;resize:vertical;min-height:92px;line-height:1.5}
.full-row{display:block;padding:0 30px 0 32px}
.full-row .label{padding-bottom:5px}
.full-row .value{display:block;padding-bottom:10px}
.inline-note{font-size:17px;line-height:1.65;color:#333}
.photo-row{display:block;padding:0 30px 16px 32px}
.photo-row .label{padding:18px 0 8px}
.photo-tools{display:flex;align-items:center;gap:18px}
.upload-box{border:1px dashed #d0d0d0;background:#fff;min-height:110px;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#999;font-size:16px;cursor:pointer}
.camera{font-size:29px;color:#999}
.photo-hint{font-size:14px;line-height:1.7;color:#777;flex:1;min-width:0}
#preview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.photo{border:1px solid var(--line);padding:7px;min-width:0}
.photo img{width:100%;height:120px;object-fit:contain}
.photo button{border:0;background:transparent;color:#a22b32;padding:5px 0}
textarea.reason{min-height:110px}
.count{text-align:right;color:#999;font-size:13px;padding-bottom:12px}
.action-area{display:none;background:#fff;padding:18px 24px 30px}
button{font-family:inherit;cursor:pointer}
.save{width:100%;height:58px;border:0;border-radius:5px;background:#a62932;color:#fff;font-size:21px}
.secondary{width:100%;padding:13px;margin-top:9px;background:#fff;border:1px solid #ddd;border-radius:5px;color:#555;font-size:15px}
.status{font-size:13px;color:#666;text-align:center;min-height:24px;padding-top:9px}
.section-caption{padding:16px 30px 10px 32px;font-size:16px;color:#555;border-bottom:1px solid var(--line)}
.audit-row{min-height:76px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:42% 58%;padding:0 24px 0 32px;align-items:center}
.audit-row .label{font-size:21px}
.audit-row input,.audit-row select{font-size:21px}
@media(max-width:380px){
 h1{font-size:31px;margin-top:20px}
 .row{padding-left:29px;padding-right:18px;grid-template-columns:minmax(0,46%) minmax(0,54%)}
 .label,.audit-row .label{font-size:19px}
 input,select,textarea,.audit-row input,.audit-row select{font-size:19px}
 .photo-row{padding-left:29px;padding-right:18px}
 .photo-tools{gap:10px}.photo-hint{font-size:12px}
}
@media(min-width:700px){
 body{max-width:900px;margin:0 auto;border-left:1px solid #eee;border-right:1px solid #eee}
 .topbar{position:sticky}
 h1{font-size:34px}
}

.value{position:relative}
/* 透明的原生日期控件覆盖在日期文字上：手机上的真实触摸操作会直接落到 date input，
   避免 iOS/部分安卓浏览器不响应脚本触发的日期选择器。 */
.native-date-picker{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;opacity:0!important;pointer-events:auto!important;z-index:3!important;padding:0!important;margin:0!important;border:0!important;background:transparent!important;-webkit-appearance:none!important;appearance:none!important;cursor:pointer!important}
#applyDate,#entryDate{position:relative;z-index:1;border:0;border-radius:0;padding:12px 0;text-align:right;color:var(--value);cursor:pointer;background:transparent}
.entry-date-row .label{align-self:center}
.entry-date-row .inline-note{font-size:17px;line-height:1.6;margin-top:3px}
.photo-row .value textarea{border:0;border-radius:0;padding:5px 0;min-height:88px;text-align:left}
.photo-row .count{padding:0 0 8px}
.approval-block{border-bottom:1px solid var(--line);padding:18px 32px 20px;min-height:135px;background:#fff}
.approval-title{font-size:21px;margin-bottom:12px}
.approval-status{font-size:21px;color:var(--value);margin-bottom:12px}
.approval-sign{display:flex;justify-content:flex-end;align-items:center;gap:4px;color:var(--value);font-size:21px;white-space:nowrap}
.approval-sign input{width:auto;min-width:0;border:0;border-radius:0;padding:0;background:transparent;color:var(--value);font-size:21px;text-align:left}
#reviewer{width:78px}
#approvalDate{width:174px}
.progress-row{height:75px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;background:#fff;border-bottom:9px solid #ededed;font-size:21px}
.progress-view{color:#164b87;display:flex;align-items:center;gap:10px}
.progress-view b{font-size:28px;font-weight:300;color:#999}
\n</style>
</head>
<body>
<header class="topbar">
  <div class="back" aria-hidden="true">‹</div>
  <div class="top-title">学生、学生家长车辆临时入校停放申请</div>
  <button class="top-actions" id="menuBtn" type="button" aria-label="更多操作" style="border:0;color:#fff;cursor:pointer"><span>•••</span><span></span></button>
</header>
<h1>学生、学生家长车辆临时入校停放申请</h1>
<div class="rule"></div>
<form id="application">
  <div class="row"><label class="label required" for="applyDate">申请时间：</label><div class="value"><input id="applyDate" name="申请时间" type="text" inputmode="none" autocomplete="off" readonly required aria-label="申请时间，点击选择日期"><input id="applyDatePicker" type="date" class="native-date-picker" tabindex="-1" aria-hidden="true"></div></div>
  <div class="row"><label class="label required" for="college">学院：</label><div class="value"><input id="college" name="学院" placeholder="请输入学院" required></div></div>
  <div class="row"><label class="label required" for="applicant">申请人：</label><div class="value"><input id="applicant" name="申请人" placeholder="请输入姓名" required></div></div>
  <div class="row"><label class="label required" for="studentId">学号：</label><div class="value"><input id="studentId" name="学号" placeholder="请输入学号" required></div></div>
  <div class="row"><label class="label required" for="className">班级：</label><div class="value"><input id="className" name="班级" placeholder="请输入班级" required></div></div>
  <div class="row"><label class="label" for="studentType">学历：</label><div class="value"><div class="select-wrap"><select id="studentType" name="学历"><option>本专科生</option><option>本科生</option><option>专科生</option><option>研究生</option><option>其他</option></select></div></div></div>
  <div class="row"><label class="label required" for="campus">停放校区：</label><div class="value"><div class="select-wrap"><select id="campus" name="停放校区" required><option>临港校区</option><option>徐汇校区</option><option>其他</option></select></div></div></div>
  <div class="row"><label class="label required" for="plate">车辆号牌：</label><div class="value"><input id="plate" name="车辆号牌" placeholder="请输入车牌号" required></div></div>
  <div class="row"><label class="label" for="carModel">车辆型号：</label><div class="value"><input id="carModel" name="车辆型号" placeholder="请输入车辆型号"></div></div>
  <div class="row"><label class="label" for="carColor">车辆颜色：</label><div class="value"><input id="carColor" name="车辆颜色" placeholder="请输入车辆颜色"></div></div>
  <div class="row"><label class="label required" for="driver">驾驶人：</label><div class="value"><input id="driver" name="驾驶人" placeholder="请输入驾驶人" required></div></div>
  <div class="row"><label class="label" for="parentName">家长姓名（注明与本人关系）：</label><div class="value"><input id="parentName" name="家长姓名" placeholder="姓名及关系"></div></div>
  <div class="row"><label class="label required" for="idNumber">身份证号：</label><div class="value"><input id="idNumber" name="身份证号" placeholder="请输入身份证号" required></div></div>
  <div class="row"><label class="label required" for="phone">联系电话：</label><div class="value"><input id="phone" name="联系电话" type="tel" placeholder="请输入联系电话" required></div></div>
  <div class="row"><label class="label required" for="drivingYears">驾龄（正式驾龄1年以上方可入校）：</label><div class="value"><div class="select-wrap"><select id="drivingYears" name="驾龄" required><option value="">请选择</option><option>1年</option><option>2年</option><option>3年</option><option>4年</option><option>5年及以上</option></select></div></div></div>
  <div class="row"><label class="label required" for="owner">行驶证车主（注明与本人关系）：</label><div class="value"><input id="owner" name="行驶证车主" placeholder="姓名及关系" required></div></div>
  <div class="photo-row">
    <div class="label required">驾驶证、行驶证（正本）复印件：</div>
    <div class="photo-tools">
      <label class="upload-box" for="photoInput"><span class="camera">▣</span><span>点击上传证件照片</span><input id="photoInput" type="file" accept="image/*" multiple hidden></label>
      <div class="photo-hint">可上传驾驶证、行驶证照片。建议拍摄清晰完整的照片。</div>
    </div>
    <div id="preview"></div>
  </div>
  <div class="photo-row">
    <div class="label required">申请事由：</div>
    <div class="value"><textarea class="reason" id="reason" name="申请事由" maxlength="200" placeholder="请输入申请事由" required></textarea><div class="count"><span id="count">0</span>/200</div></div>
  </div>
  <div class="row entry-date-row"><label class="label required" for="entryDate">申请入校时间<div class="inline-note">(7:00–21:00,车辆停放在指定区域，校内不得行车)</div></label><div class="value"><input id="entryDate" name="申请入校日期" type="text" inputmode="none" autocomplete="off" readonly required aria-label="申请入校日期，点击选择日期"><input id="entryDatePicker" type="date" class="native-date-picker" tabindex="-1" aria-hidden="true"></div></div>
  <div class="approval-block">
    <div class="approval-title">辅导员审核：</div>
    <div class="approval-status">同意</div>
    <div class="approval-sign">—— <input id="reviewer" name="审核人" value="陈俊民" aria-label="审核人姓名"><input id="approvalDate" name="审核日期" value="2026-10-08 20:59" aria-label="审核日期和时间"></div>
  </div>
  <div class="progress-row"><span>流程进度</span><span class="progress-view">查看 <b>›</b></span></div>
  <div class="action-area" style="padding:10px 20px 20px">
    <button type="button" class="secondary" id="exportBtn">导出备份</button>
    <button type="button" class="secondary" id="importBtn">导入备份</button>
    <input type="file" id="importInput" accept=".json,application/json" hidden>
    <button type="button" class="secondary" id="clearBtn">清空内容</button>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
</form>
<script>
(()=> {
const $=id=>document.getElementById(id), key='vehicle-application-local-v3';
const dateNow=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let photos=[];
$('applyDate').value=dateNow();$('entryDate').value=dateNow();
$('applyDatePicker').value=$('applyDate').value;$('entryDatePicker').value=$('entryDate').value;
[['applyDate','applyDatePicker'],['entryDate','entryDatePicker']].forEach(([visible,picker])=>{
  // 微信内置浏览器对透明 date input 的触摸处理不一致；可见字段点击时尝试聚焦原生控件。
  $(visible).addEventListener('click',()=>{try{$(picker).focus({preventScroll:true});if(typeof $(picker).showPicker==='function')$(picker).showPicker()}catch(e){}});
  // 日期控件本身覆盖日期显示区域，使用真实触摸/点击开启原生日期选择器；
  // change 事件再把 ISO 日期同步到可见文本框，保证电脑与手机都显示 YYYY-MM-DD。
  $(picker).addEventListener('change',()=>{
    if($(picker).value){$(visible).value=$(picker).value;}
  });
});
$('reason').addEventListener('input',()=>$('count').textContent=$('reason').value.length);
function collect(){
let values={};$('application').querySelectorAll('input[name],select[name],textarea[name]').forEach(el=>{if(el.type!=='file')values[el.name]=el.value});
return {values,photos,updatedAt:new Date().toISOString()};
}
function restore(data){
if(!data||typeof data!=='object')throw Error('格式错误');
Object.entries(data.values||{}).forEach(([name,value])=>{let el=[...document.querySelectorAll('[name]')].find(x=>x.name===name);if(el&&el.type!=='file')el.value=value});
photos=Array.isArray(data.photos)?data.photos.filter(p=>p&&typeof p.data==='string'):[];
renderPhotos();$('count').textContent=$('reason').value.length;
if(!$('applyDate').value)$('applyDate').value=dateNow();
if(!$('entryDate').value)$('entryDate').value=dateNow();
$('applyDatePicker').value=$('applyDate').value;
$('entryDatePicker').value=$('entryDate').value;
}
function save(silent=false){
try{localStorage.setItem(key,JSON.stringify(collect()));if(!silent)$('status').textContent='已保存到本设备';}
catch(e){$('status').textContent='保存失败：本地存储空间可能不足，请减少照片或导出备份。'}
}
function renderPhotos(){
$('preview').replaceChildren();
photos.forEach((p,i)=>{let box=document.createElement('div');box.className='photo';let img=document.createElement('img');img.src=p.data;img.alt=p.name;let name=document.createElement('div');name.className='photo-name';name.textContent=p.name;let b=document.createElement('button');b.type='button';b.textContent='移除照片';b.onclick=()=>{photos.splice(i,1);renderPhotos();save(true)};box.append(img,name,b);$('preview').append(box)});
}
try{let old=localStorage.getItem(key);if(old)restore(JSON.parse(old))}catch(e){$('status').textContent='读取草稿失败，可尝试导入备份'}
$('application').querySelectorAll('input,select,textarea').forEach(el=>{
  if(el.type==='file')return;
  el.addEventListener('input',()=>save(true));
  el.addEventListener('change',()=>save(true));
});
window.addEventListener('pagehide',()=>save(true));
$('application').addEventListener('submit',e=>{e.preventDefault();save()});
$('menuBtn').addEventListener('click',()=>{if(window.AndroidApp&&AndroidApp.openMenu)AndroidApp.openMenu();else {const choice=prompt('输入 1 保存，2 导出，3 导入，4 清空','1');if(choice==='1')save();else if(choice==='2')$('exportBtn').click();else if(choice==='3')$('importBtn').click();else if(choice==='4')$('clearBtn').click();}});
$('photoInput').addEventListener('change',async e=>{
for(let f of [...e.target.files]){
if(!f.type.startsWith('image/'))continue;
if(f.size>2*1024*1024){$('status').textContent='单张照片请小于2MB，避免本地存储空间不足。';continue}
if(photos.length>=4){$('status').textContent='最多上传4张照片';break}
let data=await new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>resolve(null);r.readAsDataURL(f)});
if(data)photos.push({name:f.name,data});
}renderPhotos();save(true);e.target.value='';
});
window.exportForAndroid=()=>{const data=JSON.stringify(collect(),null,2);if(window.AndroidApp&&AndroidApp.exportBackup){AndroidApp.exportBackup(data);return;}let blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='车辆临时入校申请备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='已导出备份，请妥善保管。'};
$('exportBtn').onclick=()=>window.exportForAndroid();
$('importBtn').onclick=()=>$('importInput').click();
$('importInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{restore(JSON.parse(await f.text()));save();$('status').textContent='已导入备份并保存'}catch(err){$('status').textContent='导入失败：请选用本软件导出的JSON文件'}e.target.value=''};
$('clearBtn').onclick=()=>{if(!confirm('确定清空全部填写内容及照片？'))return;$('application').reset();photos=[];renderPhotos();$('applyDate').value=dateNow();$('entryDate').value=dateNow();$('applyDatePicker').value=$('applyDate').value;$('entryDatePicker').value=$('entryDate').value;$('count').textContent='0';localStorage.removeItem(key);$('status').textContent='已清空'};
})();
</script>

<style>
.powered-by{padding:18px 12px calc(18px + env(safe-area-inset-bottom));text-align:center;color:#999;font-size:12px;letter-spacing:.35px;}
</style>
<div class="powered-by">powered by maidou</div>
</body>
</html>
